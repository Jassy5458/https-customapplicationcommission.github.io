<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request Commission | Custom Dev Services</title>
  <style>
    :root {
      --bg-main: #0e0d14;
      --bg-card: #171522;
      --accent-purple: #9d4edd;
      --accent-glow: #7b2cbf;
      --text-primary: #f8f9fa;
      --text-secondary: #adb5bd;
      --border-color: #2b2640;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-primary); line-height: 1.6; }

    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1.5rem 10%; background-color: rgba(14, 13, 20, 0.9);
      border-bottom: 1px solid var(--border-color); position: sticky; top: 0;
      backdrop-filter: blur(10px); z-index: 100;
    }

    .logo { font-size: 1.4rem; font-weight: 700; color: var(--text-primary); text-decoration: none; }
    .logo span { color: var(--accent-purple); }

    nav a { color: var(--text-secondary); text-decoration: none; margin-left: 1.5rem; transition: color 0.3s; }
    nav a:hover, nav a.active { color: var(--accent-purple); }

    .contact { padding: 4rem 10%; max-width: 700px; margin: 0 auto; }
    .section-title { text-align: center; font-size: 2rem; margin-bottom: 2rem; }
    .contact-form { background-color: var(--bg-card); border: 1px solid var(--border-color); padding: 2.5rem; border-radius: 12px; }

    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; color: var(--text-secondary); }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 0.8rem; background-color: var(--bg-main);
      border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-primary); font-size: 1rem;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--accent-purple); }

    .btn {
      display: inline-block; background: linear-gradient(135deg, var(--accent-purple), var(--accent-glow));
      color: #fff; padding: 0.8rem 1.8rem; border-radius: 8px; border: none; font-weight: 600;
      box-shadow: 0 4px 15px rgba(157, 78, 221, 0.3); transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; width: 100%;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(157, 78, 221, 0.5); }

    footer { text-align: center; padding: 2rem; color: var(--text-secondary); border-top: 1px solid var(--border-color); font-size: 0.9rem; margin-top: 4rem; }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">Dev<span>Services</span></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About Me</a>
      <a href="request.html" class="active">Request Commission</a>
    </nav>
  </header>

  <section class="contact">
    <h2 class="section-title">Request a Commission</h2>
    
    <!-- REPLACE WITH YOUR FORMSPREE ENDPOINT -->
    <form class="contact-form" action="https://formspree.io/f/yourformid" method="POST">
      <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" placeholder="John Doe" required>
      </div>

      <div class="form-group">
        <label for="email">Your Email</label>
        <input type="email" id="email" name="email" placeholder="john@example.com" required>
      </div>

      <div class="form-group">
        <label for="service">Service Needed</label>
        <select id="service" name="service" required>
          <option value="website">Web Development</option>
          <option value="app">App Development</option>
          <option value="game">Game Development</option>
          <option value="other">Other / Custom Request</option>
        </select>
      </div>

      <div class="form-group">
        <label for="budget">Estimated Budget</label>
        <input type="text" id="budget" name="budget" placeholder="e.g. $100 - $500">
      </div>

      <div class="form-group">
        <label for="details">Project Details</label>
        <textarea id="details" name="details" rows="5" placeholder="Describe what you want built..." required></textarea>
      </div>

      <button type="submit" class="btn">Submit Request</button>
    </form>
  </section>

  <footer>
    <p>© 2026 Jasmine. All rights reserved.</p>
  </footer>

</body>
</html>
